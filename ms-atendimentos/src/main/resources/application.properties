spring.application.name=ms-atendimentos

spring.profiles.active=dev
spring.jpa.open-in-view=false

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

server.port=0

eureka.instance.instance-id=${spring.application.name}:${random.int[1,99]}

spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

resilience4j.circuitbreaker.instances.atualizarOcorrencia.slidingWindowSize=3
resilience4j.circuitbreaker.instances.atualizarOcorrencia.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.atualizarOcorrencia.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.atualizarOcorrencia.failureRateThreshold=50
resilience4j.circuitbreaker.instances.atualizarOcorrencia.waitDurationInOpenState=50s
resilience4j.circuitbreaker.instances.atualizarOcorrencia.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.atualizarOcorrencia.ignoreExceptions=br.com.fiap.ms.atendimentos.exceptions.ResourceNotFoundException,br.com.fiap.ms.atendimentos.exceptions.RegraNegocioException
